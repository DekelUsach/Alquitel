# CI mínimo: compila la solución y corre los tests de Core en cada push/PR a main.
# Elimina el "compila en mi máquina": un PR que rompe el build o los tests no se mergea.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    # windows-latest: Alquitel.UI/Infrastructure targetean net8.0-windows (WPF + COM).
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore Alquitel.sln

      - name: Build
        run: dotnet build Alquitel.sln --no-restore -c Release

      - name: Test
        run: dotnet test Alquitel.Core.Tests/Alquitel.Core.Tests.csproj --no-build -c Release --verbosity normal

  # Al taggear vX.Y.Z: publica self-contained, empaqueta con Velopack (vpk) y sube
  # el instalador (Setup.exe + delta packages) como GitHub Release. La app en
  # runtime (VelopackUpdateService → GithubSource) chequea ese mismo repo público
  # para auto-actualizarse — ver Updates:GithubRepoUrl en appsettings.json.
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-and-test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish (self-contained x64)
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish Alquitel.UI/Alquitel.UI.csproj -c Release -r win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:PublishReadyToRun=true -p:Version="$VERSION" -o publish

      - name: Upload raw publish artifact
        uses: actions/upload-artifact@v4
        with:
          name: alquitel-${{ github.ref_name }}
          path: publish/

      - name: Install vpk (Velopack CLI)
        run: dotnet tool install --global vpk

      - name: Pack with Velopack
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          vpk pack \
            --packId Alquitel \
            --packVersion "$VERSION" \
            --packDir publish \
            --packAuthors "Grupo Alquitel" \
            --packTitle "Alquitel" \
            --mainExe Alquitel.UI.exe \
            --icon Alquitel.UI/Assets/app.ico \
            -o Releases

      - name: Upload release to GitHub
        shell: bash
        run: |
          vpk upload github \
            --repoUrl https://github.com/${{ github.repository }} \
            --token ${{ secrets.GITHUB_TOKEN }} \
            --tag ${{ github.ref_name }} \
            --publish \
            -o Releases
